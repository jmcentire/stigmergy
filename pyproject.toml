[project]
name = "stigmergy"
version = "0.1.2"
description = "Organizational awareness through stigmergic signal processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Jeremy McEntire", email = "j.andrew.mcentire@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jmcentire/stigmergy"
Repository = "https://github.com/jmcentire/stigmergy"
Issues = "https://github.com/jmcentire/stigmergy/issues"

[project.scripts]
stigmergy = "stigmergy.cli.main:cli"

[project.optional-dependencies]
cli = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ownership = [
    "python-igraph>=0.11",
    "orjson>=3.9",
    "polars>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-x -q"
